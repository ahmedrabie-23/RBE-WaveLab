name: Bug Report
description: Report a reproducible technical problem.
title: '[Bug] '
body:
- type: markdown
  attributes:
    value: 'Public report: do not include passwords, confidential projects, proprietary engineering data,
      customer information or unnecessary personal paths. For security concerns use SECURITY.md instead.'
- type: input
  id: app-version
  attributes:
    label: Application version
    description: Copy the actual version; say unknown if unavailable.
  validations:
    required: true
- type: input
  id: windows-version
  attributes:
    label: Windows version/build and architecture
    description: For example Windows 11 x64; do not assume a build number.
  validations:
    required: true
- type: textarea
  id: reproduction
  attributes:
    label: Reproduction steps
    description: Use a minimal nonconfidential example, settings and units where relevant.
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: Expected behavior
    description: Explain the expected result and its basis.
  validations:
    required: true
- type: textarea
  id: actual
  attributes:
    label: Actual behavior
    description: Include relevant messages. Unknown values are not zero.
  validations:
    required: true
- type: textarea
  id: screenshots
  attributes:
    label: Optional screenshots or additional context
    description: Review/redact screenshots and paste only safe relevant details.
  validations:
    required: false
- type: checkboxes
  id: privacy
  attributes:
    label: Public sharing check
    options:
    - label: I have removed credentials, confidential projects and proprietary engineering data.
      required: true
