name: Documentation Problem
description: Report an unclear, missing or incorrect public explanation.
title: '[Docs] '
body:
- type: markdown
  attributes:
    value: 'Public report: do not include passwords, confidential projects, proprietary engineering data,
      customer information or unnecessary personal paths. For security concerns use SECURITY.md instead.'
- type: input
  id: page
  attributes:
    label: Documentation page or link
    description: Use a public repository-relative path or public URL, not a personal file path.
  validations:
    required: true
- type: textarea
  id: problem
  attributes:
    label: What is unclear or incorrect?
  validations:
    required: true
- type: textarea
  id: suggestion
  attributes:
    label: Suggested correction or expected explanation
  validations:
    required: true
- type: textarea
  id: context
  attributes:
    label: Optional version/context
    description: Include only nonconfidential information.
  validations:
    required: false
